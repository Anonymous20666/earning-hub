# Domain spelling is intentional: supplied and confirmed by the founder.
server {
    listen 80;
    listen [::]:80;
    server_name pappy-earnig-hub.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pappy-earning-hub-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://pappy-earnig-hub.duckdns.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pappy-earnig-hub.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/pappy-earnig-hub.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pappy-earnig-hub.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PappyEarningHubSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/pappy-earning-hub.access.log;
    error_log /var/log/nginx/pappy-earning-hub.error.log warn;
    client_max_body_size 32k;
    client_body_timeout 15s;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3107;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, do not append, any client-supplied forwarding chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
